[project]
name = "persianviolencebench"
version = "1.0.0"
description = "Reproducible PersianViolenceBench ingestion and canonical data schemas"
readme = "README.md"
authors = [
    { name = "Parham_Azizi", email = "aziziparham2020@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
]

[project.scripts]
pvb-normalize = "pvb.ingestion.normalize:main"
pvb-validate = "pvb.ingestion.validate:main"

[project.optional-dependencies]
local-translation = [
    "torch==2.6.0",
    "transformers==4.57.6",
    "accelerate>=1.10,<2",
    "bitsandbytes>=0.48,<0.49",
    "huggingface-hub>=0.34,<1",
    "sentencepiece>=0.2,<0.3",
    "pillow>=11,<12",
]
nexoradb = [
    "nexoradatabase==0.2.1 ; python_full_version < '3.11' and platform_machine == 'x86_64' and sys_platform == 'linux'",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.uv.build-backend]
module-name = "pvb"

[tool.uv.sources]
torch = { url = "https://download.pytorch.org/whl/cu124/torch-2.6.0%2Bcu124-cp310-cp310-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.10'" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
